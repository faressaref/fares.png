<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='style.css'></head><body>
<nav class="navbar"><div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:12px;color:white;text-decoration:none;"><img src="assets/images/logo.png" style="width:42px"><span>Fares Salah</span></a></div><div class="menu-toggle">☰</div><div class="nav-links"><a href="index.html">Home</a><a href="portfolio.html">Portfolio</a><a href="work-with-me.html">Work With Me</a><a href="links.html">Links</a></div></nav>
<h1>Portfolio</h1><div id='projects' style="display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBR7tqs0tGxC_F7N1-MiiIdXFcGu_QjJbs",authDomain:"fares-png.firebaseapp.com",projectId:"fares-png",storageBucket:"fares-png.firebasestorage.app",messagingSenderId:"614335638714",appId:"1:614335638714:web:2beb94f0041b69c6dca683"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const snap=await getDocs(collection(db,'projects'));
const wrap=document.getElementById('projects');
snap.forEach(d=>{
 const p=d.data();
 wrap.innerHTML += `<a href="project.html?id=${d.id}" style="text-decoration:none;color:white"><div class="project-card" style="overflow:hidden;background:#111;border-radius:20px;">
 ${p.cover?`<img src="${p.cover}" style="width:100%;height:280px;object-fit:cover;display:block;">`:`<div style="height:280px;background:#181818"></div>`}
 <div style="padding:20px"><h3>${p.name||''}</h3><p>${p.category||''}</p></div></div></a>`;
});
</script><script>const t=document.querySelector(".menu-toggle");const n=document.querySelector(".nav-links");t&&t.addEventListener("click",()=>n.classList.toggle("active"));</script></body></html>
